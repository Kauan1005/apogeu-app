<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celular</title><link rel="stylesheet" href="tokens.css">
<style>
body { padding: 40px; }
.phones { display: flex; gap: 40px; justify-content: center; }
.ph { width: 390px; height: 844px; border-radius: 44px; border: 1px solid var(--border-strong); background: var(--bg); overflow: hidden; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.sb { height: 48px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 13px; font-weight: 500; }
.pc { padding: 4px 16px 100px; display: grid; gap: 12px; }
.hdr { display: flex; align-items: center; gap: 10px; height: 44px; }
.hdr h2 { font-size: 17px; font-weight: 500; flex: 1; }
.hero { padding: 18px; }
.hero .v { font-size: 34px; font-weight: 500; letter-spacing: -0.02em; margin-top: 6px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini { padding: 14px; } .mini .v { font-size: 18px; font-weight: 500; margin-top: 4px; }
.banner { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 14px; background: rgba(250,178,25,.10); border: 1px solid rgba(250,178,25,.25); }
.tx { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; min-height: 56px; }
.tabs { position: absolute; bottom: 0; left: 0; right: 0; height: 84px; border-top: 1px solid var(--border); background: rgba(11,11,11,.92); display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 6px 24px; }
.tabs a { display: grid; justify-items: center; gap: 4px; font-size: 13px; color: var(--muted); text-decoration: none; min-height: 44px; align-content: center; }
.tabs a.on { color: var(--ink); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface-2); border-top-left-radius: 24px; border-top-right-radius: 24px; border-top: 1px solid var(--border-strong); padding: 10px 16px 32px; box-shadow: 0 -20px 50px rgba(0,0,0,.55); }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border-strong); margin: 0 auto 14px; }
.catgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.catgrid span { display: grid; justify-items: center; gap: 6px; padding: 12px 4px; border-radius: 12px; border: 1px solid var(--border); font-size: 13px; color: var(--ink-2); min-height: 72px; }
.catgrid span.on { border-color: var(--ink); color: var(--ink); background: var(--surface-3); }
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.5); }
.hide { letter-spacing: 2px; color: var(--ink-2); }
.notif { margin: 6px 0 4px; padding: 14px; border-radius: 18px; background: rgba(40,40,38,.95); border: 1px solid var(--border-strong); display: grid; grid-template-columns: 36px 1fr; gap: 12px; }
.notif .acts { grid-column: 2; display: flex; gap: 8px; margin-top: 6px; }
</style></head>
<body><div class="phones" id="phones"></div>
<script src="app.js"></script>
<script>
const tabs = (on) => `<nav class="tabs">${[['dashboard', 'Painel'], ['table', 'Transações'], ['inbox', 'Revisar'], ['calendar', 'Contas'], ['more', 'Mais']].map(([i, l], k) => `<a href="#" class="${k === on ? 'on' : ''}">${icon(i, 'lg')}${l}</a>`).join('')}</nav>`;
const tx = (c, n, s, v) => `<div class="tx"><span class="ico-box" style="width:40px;height:40px">${icon(CATS[c].i)}</span><div><div>${n}</div><div class="t-xs muted">${s}</div></div><span class="num ${v > 0 ? 'in' : ''}">${brl(v, true)}</span></div>`;
const sb = `<div class="sb"><span class="num">12:42</span><span class="t-xs">5G ▮▮▮</span></div>`;

const p1 = `<div class="ph">${sb}<div class="pc">
  <div class="hdr"><span class="brand-mark">F</span><h2>Novembro</h2><button class="btn icon" style="width:44px;height:44px">${icon('eye')}</button></div>
  <div class="card hero"><div class="t-sm muted">Saldo consolidado</div><div class="v num">R$ 18.432,90</div><div class="t-xs muted" style="margin-top:6px">Projeção para 30/11: <span class="ink2 num">R$ 15.247,82</span></div></div>
  <div class="two"><div class="card mini"><div class="t-xs muted">Entradas</div><div class="v num in">R$ 11.353,40</div></div><div class="card mini"><div class="t-xs muted">Saídas</div><div class="v num out">R$ 6.214,37</div></div></div>
  <div class="banner"><span style="color:var(--warning)">${icon('inbox')}</span><div style="flex:1"><div>7 transações para revisar</div><div class="t-xs muted">Toque para confirmar as categorias</div></div>${icon('chevright')}</div>
  <div class="card" style="padding:16px"><h3>Gastos por categoria</h3><div style="display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:center;margin-top:10px"><div id="d1"></div>
   <div class="legend">${[['Moradia', 'var(--c1)', '30%'], ['Alimentação', 'var(--c2)', '21%'], ['Contas fixas', 'var(--c3)', '14%'], ['Demais', 'var(--c-rest)', '35%']].map(([n, c, p]) => `<div class="row" style="grid-template-columns:10px 1fr auto"><i class="dot" style="background:${c}"></i><span>${n}</span><span class="num muted">${p}</span></div>`).join('')}</div></div></div>
  <div class="card" style="padding:8px 16px"><h3 style="padding-top:8px">Últimas</h3>${tx('alimentacao', 'Bar do Zé', 'Pix · hoje 12:41', -78)}${tx('transporte', 'Uber', 'Cartão Inter · 08:05', -23.9)}</div>
 </div>${tabs(0)}</div>`;

const p2 = `<div class="ph">${sb}<div class="pc">
  <div class="hdr"><h2>Transações</h2><button class="btn icon" style="width:44px;height:44px">${icon('search')}</button><button class="btn icon" style="width:44px;height:44px">${icon('filter')}</button></div>
  <div class="t-xs muted">HOJE · − R$ 156,80</div>
  ${tx('alimentacao', 'Bar do Zé', 'Pix · Nubank · 12:41', -78)}${tx('transporte', 'Uber', 'Cartão Inter · 08:05', -23.9)}${tx('alimentacao', 'Padaria Real', 'Cartão Nubank · 07:58', -18.5)}
 </div><div class="dim"></div>
 <div class="sheet"><div class="grab"></div><div style="display:flex;justify-content:space-between;align-items:baseline"><div><div style="font-weight:500">Bar do Zé</div><div class="t-xs muted mono">PIX ENVIADO JOSE C S 17/11</div></div><span class="num" style="font-size:20px;font-weight:500">− R$ 78,00</span></div>
  <div class="catgrid">${[['alimentacao', 1], ['lazer'], ['transporte'], ['moradia'], ['compras'], ['outros']].map(([k, on]) => `<span class="${on ? 'on' : ''}">${icon(CATS[k].i, 'lg')}${CATS[k].n}</span>`).join('')}</div>
  <div class="t-sm ink2" style="display:flex;gap:10px;align-items:center;margin:16px 0"><i class="cb on"></i>Lembrar para este destinatário</div>
  <button class="btn primary" style="width:100%;height:48px;justify-content:center">Salvar categoria</button></div></div>`;

const p3 = `<div class="ph">${sb}<div class="pc">
  <div class="hdr"><span class="brand-mark">F</span><h2>Novembro</h2><button class="btn icon" style="width:44px;height:44px;background:var(--ink);color:var(--bg)">${icon('eyeoff')}</button></div>
  <div class="card hero"><div class="t-sm muted">Saldo consolidado</div><div class="v hide">R$ ••••••</div><div class="t-xs muted" style="margin-top:6px">Modo privacidade ativo</div></div>
  <div class="two"><div class="card mini"><div class="t-xs muted">Entradas</div><div class="v hide">••••</div></div><div class="card mini"><div class="t-xs muted">Saídas</div><div class="v hide">••••</div></div></div>
  <div class="card" style="padding:16px"><h3>${icon('target', 'sm')}Orçamentos</h3>${[['Compras', 100, 'critical'], ['Alimentação', 95, 'warning'], ['Lazer', 65, 'ink-2']].map(([n, p, c]) => `<div class="bud" style="display:grid;gap:6px;padding:10px 0"><div style="display:flex;justify-content:space-between" class="t-sm"><span>${n}</span><span class="num muted">${p}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${p}%;background:var(--${c})"></div></div></div>`).join('')}</div>
  <div class="card" style="padding:16px"><h3>${icon('flag', 'sm')}Reserva de emergência</h3><div style="display:flex;justify-content:space-between;margin-top:10px" class="t-sm"><span class="hide">R$ ••••</span><span class="num muted">62% de 6 meses</span></div><div class="bar-track" style="margin-top:8px"><div class="bar-fill" style="width:62%;background:var(--ink-2)"></div></div></div>
 </div>${tabs(0)}</div>`;

document.getElementById('phones').innerHTML = p1 + p2 + p3;
const dd = document.getElementById('d1'); donut(dd, [{ v: 1850, c: 'var(--c1)' }, { v: 1326.4, c: 'var(--c2)' }, { v: 842.15, c: 'var(--c3)' }, { v: 2195.82, c: 'var(--c-rest)' }], 6214.37);
dd.querySelector('svg').setAttribute('width', 110); dd.querySelector('svg').setAttribute('height', 110); dd.querySelectorAll('text').forEach(t => t.remove());
</script></body></html>
